name: "nix-build"
on:
  pull_request:
  push:
    branches:
    - master
  workflow_dispatch:
jobs:
  # Check is valid nix config.
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          accept-flake-config = true
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-ci-${{ hashFiles('flake.lock', '**/*.nix') }}
        restore-prefixes-first-match: |
          nix-${{ runner.os }}-ci-
          nix-${{ runner.os }}-build-
        gc-max-store-size-linux: 3G
    - name: Check flake evaluation
      run: nix flake check --no-build
    - name: Evaluate activation packages
      run: |
        set -euo pipefail

        nix eval --raw '.#legacyPackages."x86_64-linux".homeConfigurations."sk@wsl".activationPackage.drvPath'
  # Manual full build for profiles that may require slow package builds.
  # Also uploads the materialized home-files artifacts for each profile.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        profile:
        - sk@wsl
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          accept-flake-config = true
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: sotiak
        authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
        skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
    - name: Build activation package
      run: nix build '.#legacyPackages."x86_64-linux".homeConfigurations."${{ matrix.profile }}".activationPackage'
    - name: Build home-files
      run: nix build --out-link "home-files-${{ matrix.profile }}" '.#legacyPackages."x86_64-linux".homeConfigurations."${{ matrix.profile }}".config.home-files'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: home-files-${{ matrix.profile }}
        path: home-files-${{ matrix.profile }}/
        if-no-files-found: error
        include-hidden-files: true

  build-mbp-a2159:
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: |
          accept-flake-config = true
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: sotiak
        authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.CACHIX_AUTH_TOKEN || '' }}
        skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
    - name: Build Intel Mac activation package
      run: nix build --no-link '.#legacyPackages."x86_64-darwin".homeConfigurations."sk@mbp-a2159".activationPackage'
